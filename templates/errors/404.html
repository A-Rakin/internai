{% extends 'base.html' %}{% load static %}
{% block title %}Page Not Found{% endblock %}
{% block content %}
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:2rem;">
    <div>
        <h1 style="font-size:6rem;font-weight:800;background:linear-gradient(135deg,var(--primary),var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;">404</h1>
        <h3 class="mb-3">Page Not Found</h3>
        <p style="color:var(--text-muted);max-width:400px;margin:0 auto var(--space-xl);">The page you are looking for does not exist or has been moved.</p>
        <a href="/" class="btn btn-primary-custom"><i class="fas fa-home me-2"></i>Go Home</a>
    </div>
</div>
{% endblock %}
