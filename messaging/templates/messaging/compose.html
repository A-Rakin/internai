{% extends 'base.html' %}
{% load static %}
{% block title %}New Message{% endblock %}
{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/dashboard.css' %}">
{% endblock %}

{% block content %}
{% include 'components/sidebar.html' %}
<div class="main-content">
    <div class="top-navbar">
        <h4 class="page-title"><i class="fas fa-pen me-2"></i>New Message</h4>
        <div class="navbar-actions">
            <a href="{% url 'messaging:inbox' %}" class="btn btn-sm btn-outline-secondary">
                <i class="fas fa-arrow-left me-1"></i>Back to Inbox
            </a>
        </div>
    </div>

    <div class="card shadow-sm mt-4">
        <div class="card-header"><h5 class="mb-0"><i class="fas fa-envelope me-2"></i>Compose Message</h5></div>
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="recipient" class="form-label fw-semibold">To</label>
                    <select name="recipient" id="recipient" class="form-select" required>
                        <option value="">Select a recipient...</option>
                        {% for u in users %}
                        <option value="{{ u.pk }}" {% if selected_recipient_id and selected_recipient_id|add:"0" == u.pk %}selected{% endif %}>{{ u.get_full_name|default:u.email }} ({{ u.get_role_display }})</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mb-3">
                    <label for="subject" class="form-label fw-semibold">Subject <small class="text-muted">(optional)</small></label>
                    <input type="text" name="subject" id="subject" class="form-control" value="{{ initial_subject }}" placeholder="What is this about?">
                </div>
                <div class="mb-3">
                    <label for="content" class="form-label fw-semibold">Message</label>
                    <textarea name="content" id="content" class="form-control" rows="5" placeholder="Write your message here..." required></textarea>
                </div>
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-paper-plane me-1"></i>Send Message
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
