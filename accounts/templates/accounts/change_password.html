{% extends 'base.html' %}
{% load static %}
{% block title %}Change Password - InternAI{% endblock %}
{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/auth.css' %}">
{% endblock %}
{% block content %}
<div class="auth-container">
    <div class="auth-form-panel m-auto">
        <div class="auth-form-card">
            <div class="auth-logo">
                <h3>Change Password</h3>
                <p>Change your account password.</p>
            </div>
            
            <form method="post" action="{% url 'accounts:change_password' %}" class="needs-validation" novalidate>
                {% csrf_token %}
                <div class="auth-form-group">
                    <label for="old_password">Current Password</label>
                    <input type="password" id="old_password" name="old_password" class="form-control" required>
                </div>
                <div class="auth-form-group">
                    <label for="new_password">New Password</label>
                    <input type="password" id="new_password" name="new_password" class="form-control" required>
                </div>
                <button type="submit" class="auth-submit-btn">Update Password</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
