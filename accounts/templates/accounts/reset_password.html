{% extends 'base.html' %}
{% load static %}
{% block title %}Reset Password - InternAI{% endblock %}
{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/auth.css' %}">
{% endblock %}
{% block content %}
<div class="auth-container">
    <div class="auth-form-panel m-auto">
        <div class="auth-form-card">
            <div class="auth-logo">
                <h3>Reset Password</h3>
                <p>Please enter your new password below.</p>
            </div>
            
            <form method="post" action="{% url 'accounts:reset_password' %}" class="needs-validation" novalidate>
                {% csrf_token %}
                <div class="auth-form-group">
                    <label for="new_password">New Password</label>
                    <input type="password" id="new_password" name="new_password" class="form-control" required>
                </div>
                <div class="auth-form-group">
                    <label for="confirm_password">Confirm Password</label>
                    <input type="password" id="confirm_password" name="confirm_password" class="form-control" required>
                </div>
                <button type="submit" class="auth-submit-btn">Reset Password</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
