{% extends 'base.html' %}
{% load static %}
{% block title %}Forgot Password - InternAI{% endblock %}
{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/auth.css' %}">
{% endblock %}
{% block content %}
<div class="auth-container">
    <div class="auth-form-panel m-auto">
        <div class="auth-form-card">
            <div class="auth-logo">
                <h3>Forgot Password?</h3>
                <p>Enter your email and we'll send you a password reset link.</p>
            </div>
            
            <form method="post" action="{% url 'accounts:forgot_password' %}" class="needs-validation" novalidate>
                {% csrf_token %}
                <div class="auth-form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" class="form-control" required placeholder="your@email.com">
                </div>
                <button type="submit" class="auth-submit-btn">Send Reset Link</button>
            </form>
            <div class="auth-footer">
                Back to <a href="{% url 'accounts:login' %}">Login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
